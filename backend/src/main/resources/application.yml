server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./.data/peixun;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
  web:
    resources:
      static-locations: file:../frontend/dist/,classpath:/static/
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
